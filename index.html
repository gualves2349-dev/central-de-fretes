<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Fretes</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>🚚 Central de Fretes</h1><button id="logout" hidden>Sair</button></header><main><section id="auth"><h2>Entrar ou cadastrar</h2><form id="authForm"><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha (mínimo 6 caracteres)" minlength="6" required><select id="role"><option value="prestador">Prestador de fretes</option><option value="contratante">Contratante</option></select><button type="submit" name="action" value="login">Entrar</button><button type="submit" name="action" value="register">Criar conta</button></form></section><section id="workspace" hidden><p id="identity"></p><nav><button data-view="fretes">Fretes disponíveis</button><button data-view="publicar">Publicar frete</button><button data-view="veiculos">Meus veículos</button><button data-view="candidaturas">Candidaturas</button></nav><section id="fretes" class="view"><h2>Fretes disponíveis</h2><div id="freightList"></div></section><section id="publicar" class="view" hidden><h2>Publicar frete</h2><form id="freightForm"><input name="origem" placeholder="Origem (cidade/UF)" required><input name="destino" placeholder="Destino (cidade/UF)" required><input name="descricao" placeholder="Descrição da carga" required><input name="peso" type="number" min="0" step="0.01" placeholder="Peso (kg)" required><select name="carroceria"><option value="bau">Baú</option><option value="aberta">Aberta</option><option value="sider">Sider</option><option value="furgão">Furgão</option><option value="qualquer">Qualquer</option></select><input name="data" type="date" required><input name="valor" type="number" min="0" step="0.01" placeholder="Valor oferecido (R$, opcional)"><button>Publicar</button></form></section><section id="veiculos" class="view" hidden><h2>Meus veículos</h2><form id="vehicleForm"><input name="modelo" placeholder="Modelo do veículo" required><input name="placa" placeholder="Placa (privada)" required><input name="capacidade" type="number" min="1" placeholder="Capacidade em kg" required><select name="carroceria"><option value="bau">Baú</option><option value="aberta">Aberta</option><option value="sider">Sider</option><option value="furgão">Furgão</option></select><button>Cadastrar veículo</button></form><div id="vehicleList"></div></section><section id="candidaturas" class="view" hidden><h2>Candidaturas</h2><div id="applicationList"></div></section></section><p id="message" role="status"></p></main><script type="module" src="app.js"></script></body></html>
